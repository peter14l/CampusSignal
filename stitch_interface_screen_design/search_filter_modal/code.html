<script>
  const searchInput = document.getElementById('searchInput');
  const clearBtn = document.getElementById('clearSearchBtn');

  searchInput.addEventListener('input', (e) => {
    if (e.target.value.length > 0) {
      clearBtn.classList.remove('hidden');
    } else {
      clearBtn.classList.add('hidden');
    }
  });

  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    clearBtn.classList.add('hidden');
    searchInput.focus();
  });

  const filterChips = document.querySelectorAll('.flex-wrap button');
  filterChips.forEach(chip => {
    chip.addEventListener('click', () => {
      const isSelected = chip.classList.contains('bg-primary-container');
      
      if (isSelected) {
        chip.classList.remove('bg-primary-container', 'text-on-primary-container', 'shadow-sm', 'hover:bg-primary', 'hover:text-on-primary');
        chip.classList.add('bg-surface-container', 'text-on-surface', 'hover:bg-surface-container-highest');
      } else {
        chip.classList.add('bg-primary-container', 'text-on-primary-container', 'shadow-sm', 'hover:bg-primary', 'hover:text-on-primary');
        chip.classList.remove('bg-surface-container', 'text-on-surface', 'hover:bg-surface-container-highest');
      }
      
      const btnText = document.querySelector('.bg-primary span');
      btnText.style.transform = 'scale(0.95)';
      setTimeout(() => {
        btnText.style.transform = 'scale(1)';
        btnText.textContent = `Show Results (${Math.floor(Math.random() * 50) + 1})`;
      }, 150);
    });
  });
