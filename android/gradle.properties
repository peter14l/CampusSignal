# Gradle JVM and memory optimizations
org.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -XX:MaxMetaspaceSize=1024m -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError

# Parallel Execution & Caching
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.vfs.watch=true

# AndroidX & R8 Optimization
android.useAndroidX=true
android.enableR8.fullMode=true
android.nonTransitiveRClass=true

# Kotlin Multi-drive compatibility
kotlin.incremental=false
