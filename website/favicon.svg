<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="cs-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F55DE" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <filter id="cs-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="#0B0F19" />
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="url(#cs-grad)" stroke-width="2" />
  <!-- Signal radar waves -->
  <path d="M18 46 A 22 22 0 0 1 46 18" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" opacity="0.4" />
  <path d="M22 46 A 16 16 0 0 1 42 26" stroke="#4F55DE" stroke-width="4" stroke-linecap="round" opacity="0.75" />
  <path d="M26 46 A 10 10 0 0 1 38 34" stroke="#60A5FA" stroke-width="4" stroke-linecap="round" />
  <!-- Center beacon / signal emitter -->
  <circle cx="26" cy="46" r="6" fill="#34D399" filter="url(#cs-glow)" />
  <circle cx="26" cy="46" r="3" fill="#FFFFFF" />
</svg>
