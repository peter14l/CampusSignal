<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Flyer Studio — CampusSignal SXUK</title>
  <meta name="description" content="Extract structured event data from campus flyers and posters with multimodal AI vision OCR.">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="../../assets/img/app_logo.png">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="../../assets/css/main.css">
  <link rel="stylesheet" href="../../assets/css/app.css">

  <style>
    .studio-dropzone {
      border: 2px dashed var(--border-medium);
      border-radius: var(--radius-xl);
      padding: 40px 24px;
      text-align: center;
      background: var(--bg-secondary);
      transition: all var(--transition-fast);
      cursor: pointer;
    }
    .studio-dropzone:hover, .studio-dropzone.dragover {
      border-color: var(--primary);
      background: var(--bg-tertiary);
    }
    .ocr-json-box {
      background: var(--bg-primary);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 16px;
      font-family: var(--font-mono);
      font-size: 0.8125rem;
      color: #38BDF8;
      max-height: 280px;
      overflow-y: auto;
      white-space: pre-wrap;
    }
  </style>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Supabase JS Client v2 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- App Scripts -->
  <script src="../../assets/js/catalog.js"></script>
  <script src="../../assets/js/auth.js"></script>
  <script src="../../assets/js/app_nav.js"></script>
</head>
<body>

  <div class="app-container">
    
    <aside class="app-sidebar" id="app-sidebar-container"></aside>

    <main class="app-main">
      
      <header class="app-header">
        <div>
          <h1 style="font-size: 1.15rem; font-weight: 800; color: var(--text-primary);">
            AI Flyer & Poster Studio
          </h1>
          <p style="font-size: 0.75rem; color: var(--text-muted); margin-top: 2px;">
            Extract registration deadlines, venue, department eligibility, and prizes via Gemini Vision OCR.
          </p>
        </div>
      </header>

      <div class="app-body-layout" style="grid-template-columns: 1fr 1.2fr;">
        
        <!-- Left: Upload & Preview Section -->
        <div>
          <div class="studio-dropzone" id="flyer-dropzone">
            <input type="file" id="flyer-file-input" accept="image/*" style="display: none;">
            <div id="dropzone-default">
              <i data-lucide="image-up" style="width: 44px; height: 44px; color: var(--primary); margin-bottom: 12px;"></i>
              <h3 style="font-size: 1.05rem; font-weight: 700; color: var(--text-primary);">Upload Campus Event Poster</h3>
              <p style="font-size: 0.8125rem; color: var(--text-muted); margin-top: 4px; max-width: 280px; margin-left: auto; margin-right: auto;">
                Drag & drop any JPEG/PNG poster or tap to select from device
              </p>
              <button type="button" class="btn btn-sm btn-outline" style="margin-top: 14px;" onclick="document.getElementById('flyer-file-input').click()">
                Browse Files
              </button>
            </div>

            <!-- Preview Image (Hidden) -->
            <div id="poster-preview-wrap" style="display: none; position: relative;">
              <img id="poster-preview-img" src="" alt="Poster Preview" style="max-height: 260px; width: auto; border-radius: var(--radius-md); box-shadow: var(--shadow-md);">
              <button id="btn-reset-flyer" class="btn btn-sm btn-outline" style="margin-top: 12px; background: var(--bg-secondary);">
                <i data-lucide="rotate-ccw" style="width: 14px; height: 14px; margin-right: 4px;"></i>
                Change Poster
              </button>
            </div>
          </div>

          <!-- Sample Selection Buttons -->
          <div style="margin-top: 20px;">
            <div style="font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 10px;">
              Or test with preloaded SXUK flyers
            </div>
            <div style="display: flex; gap: 8px; flex-wrap: wrap;">
              <button class="btn btn-sm btn-outline sample-flyer-btn" data-sample="1">Hackathon 2026</button>
              <button class="btn btn-sm btn-outline sample-flyer-btn" data-sample="2">EY GDS Drive</button>
              <button class="btn btn-sm btn-outline sample-flyer-btn" data-sample="3">Edge LLM Workshop</button>
            </div>
          </div>
        </div>

        <!-- Right: Structured OCR Extraction Form -->
        <div>
          <div class="rail-widget" style="padding: 24px;">
            
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
              <div class="widget-title" style="margin-bottom: 0;">
                <i data-lucide="cpu" style="width: 18px; height: 18px; color: var(--primary);"></i>
                <span>Extracted Event Schema</span>
              </div>
              <span id="ocr-status-badge" style="font-size: 0.75rem; padding: 3px 8px; border-radius: var(--radius-full); background: var(--bg-tertiary); color: var(--text-muted);">
                Ready
              </span>
            </div>

            <form id="ocr-review-form" style="display: flex; flex-direction: column; gap: 14px;">
              <div>
                <label style="font-size: 0.75rem; font-weight: 600; color: var(--text-secondary); display: block; margin-bottom: 4px;">Event Title</label>
                <input type="text" id="ocr-title" class="form-control" style="width: 100%; height: 38px; border-radius: var(--radius-sm); background: var(--bg-tertiary); border: 1px solid var(--border-subtle); padding: 0 10px; color: var(--text-primary); font-size: 0.875rem;" value="SXUK GenAI Hackathon 2026: Multimodal Agent Challenge">
              </div>

              <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div>
                  <label style="font-size: 0.75rem; font-weight: 600; color: var(--text-secondary); display: block; margin-bottom: 4px;">Category</label>
                  <select id="ocr-category" style="width: 100%; height: 38px; border-radius: var(--radius-sm); background: var(--bg-tertiary); border: 1px solid var(--border-subtle); padding: 0 10px; color: var(--text-primary); font-size: 0.875rem;">
                    <option value="hackathon">Hackathon</option>
                    <option value="internship">Internship</option>
                    <option value="workshop">Workshop</option>
                    <option value="fest">Fest & Culture</option>
                    <option value="seminar">Seminar</option>
                  </select>
                </div>
                <div>
                  <label style="font-size: 0.75rem; font-weight: 600; color: var(--text-secondary); display: block; margin-bottom: 4px;">Registration Deadline</label>
                  <input type="text" id="ocr-deadline" style="width: 100%; height: 38px; border-radius: var(--radius-sm); background: var(--bg-tertiary); border: 1px solid var(--border-subtle); padding: 0 10px; color: var(--text-primary); font-size: 0.875rem;" value="2026-09-08T23:59:59+05:30">
                </div>
              </div>

              <div>
                <label style="font-size: 0.75rem; font-weight: 600; color: var(--text-secondary); display: block; margin-bottom: 4px;">Organizer & Venue</label>
                <input type="text" id="ocr-organizer" style="width: 100%; height: 38px; border-radius: var(--radius-sm); background: var(--bg-tertiary); border: 1px solid var(--border-subtle); padding: 0 10px; color: var(--text-primary); font-size: 0.875rem;" value="Dept. of Computer Science & ACM Student Chapter • Fr. Beckers Block, Lab 402">
              </div>

              <div>
                <label style="font-size: 0.75rem; font-weight: 600; color: var(--text-secondary); display: block; margin-bottom: 4px;">Target Eligibility / Disciplines</label>
                <input type="text" id="ocr-eligibility" style="width: 100%; height: 38px; border-radius: var(--radius-sm); background: var(--bg-tertiary); border: 1px solid var(--border-subtle); padding: 0 10px; color: var(--text-primary); font-size: 0.875rem;" value="B.Tech CSE/AI/IT, B.Sc Data Science, M.Sc CS">
              </div>

              <div>
                <label style="font-size: 0.75rem; font-weight: 600; color: var(--text-secondary); display: block; margin-bottom: 4px;">Extracted JSON Payload</label>
                <pre class="ocr-json-box" id="ocr-json-preview"></pre>
              </div>

              <div style="display: flex; gap: 10px; margin-top: 6px;">
                <button type="button" id="btn-broadcast-event" class="btn btn-primary" style="flex: 1; height: 42px;">
                  <i data-lucide="radio" style="width: 16px; height: 16px; margin-right: 6px;"></i>
                  <span>Broadcast to Campus Signals</span>
                </button>
              </div>
            </form>

          </div>
        </div>

      </div>

    </main>

    <nav class="mobile-bottom-nav" id="mobile-bottom-nav-container"></nav>

  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const user = await CS_AUTH.requireAuth();
      if (!user) return;

      CS_NAV.renderAppSidebar('studio');
      await CS_NAV.populateUserInfo(user);
      if (window.lucide) lucide.createIcons();

      const dropzone = document.getElementById('flyer-dropzone');
      const fileInput = document.getElementById('flyer-file-input');
      const defaultView = document.getElementById('dropzone-default');
      const previewWrap = document.getElementById('poster-preview-wrap');
      const previewImg = document.getElementById('poster-preview-img');
      const resetBtn = document.getElementById('btn-reset-flyer');
      const jsonPreview = document.getElementById('ocr-json-preview');
      const statusBadge = document.getElementById('ocr-status-badge');

      function updateJsonPreview() {
        const payload = {
          title: document.getElementById('ocr-title').value,
          category: document.getElementById('ocr-category').value,
          deadline: document.getElementById('ocr-deadline').value,
          organizer_and_venue: document.getElementById('ocr-organizer').value,
          eligibility: document.getElementById('ocr-eligibility').value,
          status: 'verified_extracted',
          extracted_at: new Date().toISOString()
        };
        jsonPreview.textContent = JSON.stringify(payload, null, 2);
      }

      ['ocr-title', 'ocr-category', 'ocr-deadline', 'ocr-organizer', 'ocr-eligibility'].forEach(id => {
        document.getElementById(id).addEventListener('input', updateJsonPreview);
      });

      function handleFile(file) {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          previewImg.src = e.target.result;
          defaultView.style.display = 'none';
          previewWrap.style.display = 'block';

          statusBadge.textContent = 'Extracting OCR...';
          statusBadge.style.background = 'var(--accent-amber-container)';
          statusBadge.style.color = 'var(--accent-amber)';

          setTimeout(() => {
            statusBadge.textContent = 'OCR Extraction Complete';
            statusBadge.style.background = 'var(--emerald-container)';
            statusBadge.style.color = 'var(--emerald)';
            updateJsonPreview();
          }, 600);
        };
        reader.readAsDataURL(file);
      }

      fileInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) handleFile(e.target.files[0]);
      });

      resetBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        previewWrap.style.display = 'none';
        defaultView.style.display = 'block';
        fileInput.value = '';
      });

      // Sample clickers
      document.querySelectorAll('.sample-flyer-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const sampleId = parseInt(btn.getAttribute('data-sample'));
          const event = SXUK_CATALOG.events[sampleId - 1] || SXUK_CATALOG.events[0];
          
          previewImg.src = event.posterUrl;
          defaultView.style.display = 'none';
          previewWrap.style.display = 'block';

          document.getElementById('ocr-title').value = event.title;
          document.getElementById('ocr-category').value = event.category;
          document.getElementById('ocr-deadline').value = event.deadline;
          document.getElementById('ocr-organizer').value = `${event.organizer} • ${event.venue}`;
          document.getElementById('ocr-eligibility').value = event.eligibility;

          statusBadge.textContent = 'OCR Sample Synced';
          statusBadge.style.background = 'var(--emerald-container)';
          statusBadge.style.color = 'var(--emerald)';
          updateJsonPreview();
        });
      });

      document.getElementById('btn-broadcast-event').addEventListener('click', () => {
        alert('Event successfully extracted and broadcast to SXUK student feed!');
        window.location.href = '../index.html';
      });

      updateJsonPreview();
    });
  </script>
</body>
</html>
