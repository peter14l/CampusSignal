<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Broadcast Signals &amp; Department Alarms — CampusSignal SXUK</title>
  <meta name="description" content="Campus-wide broadcast signals, departmental announcements, registration alerts, and Dean moderation updates for SXUK.">
  <meta name="keywords" content="CampusSignal Notifications, SXUK Broadcasts, Department Alarms, St. Xavier's University">
  <link rel="canonical" href="https://campussignal.sxuk.edu.in/app/notifications/">

  <!-- OpenGraph / Social Meta -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="CampusSignal">
  <meta property="og:url" content="https://campussignal.sxuk.edu.in/app/notifications/">
  <meta property="og:title" content="Broadcast Signals &amp; Alarms — CampusSignal SXUK">
  <meta property="og:description" content="Campus-wide broadcast signals, deadline reminders, and faculty announcements.">
  <meta property="og:image" content="https://campussignal.sxuk.edu.in/assets/img/og-preview.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Broadcast Signals &amp; Alarms — CampusSignal SXUK">
  <meta name="twitter:description" content="Campus-wide broadcast signals and faculty announcements.">
  <meta name="twitter:image" content="https://campussignal.sxuk.edu.in/assets/img/og-preview.png">

  <!-- Favicon Suite -->
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="../../favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../../favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../../apple-touch-icon.png">
  <link rel="shortcut icon" href="../../favicon.ico">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="../../assets/css/main.css">
  <link rel="stylesheet" href="../../assets/css/app.css">

  <!-- Structured Data: BreadcrumbList -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "itemListElement": [
      {
        "@type": "ListItem",
        "position": 1,
        "name": "Home",
        "item": "https://campussignal.sxuk.edu.in/"
      },
      {
        "@type": "ListItem",
        "position": 2,
        "name": "Web App",
        "item": "https://campussignal.sxuk.edu.in/app/"
      },
      {
        "@type": "ListItem",
        "position": 3,
        "name": "Broadcast Signals",
        "item": "https://campussignal.sxuk.edu.in/app/notifications/"
      }
    ]
  }
  </script>

  <!-- Lucide Icons -->
  <script defer src="https://cdn.jsdelivr.net/npm/lucide@0.441.0/dist/umd/lucide.min.js"></script>
  <!-- Supabase JS Client v2 CDN -->
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- App Scripts -->
  <script defer src="../../assets/js/catalog.js"></script>
  <script defer src="../../assets/js/auth.js"></script>
  <script defer src="../../assets/js/app_nav.js"></script>
</head>
<body>

  <div class="app-container">
    
    <aside class="app-sidebar" id="app-sidebar-container"></aside>

    <main class="app-main">
      
      <header class="app-header">
        <div>
          <!-- Breadcrumbs -->
          <nav aria-label="Breadcrumb" class="breadcrumbs" style="margin-bottom: 6px;">
            <ol>
              <li><a href="../../">Home</a></li>
              <li><a href="../">App</a></li>
              <li><span aria-current="page">Notifications</span></li>
            </ol>
          </nav>
          <h1 style="font-size: 1.15rem; font-weight: 800; color: var(--text-primary); margin: 0;">
            Broadcast Signals &amp; Alarms
          </h1>
          <p style="font-size: 0.75rem; color: var(--text-muted); margin-top: 2px;">
            Targeted notifications filtered by your SXUK department and course.
          </p>
        </div>

        <div class="header-actions">
          <button id="btn-mark-all-read" class="btn btn-sm btn-outline">
            <i data-lucide="check-check" style="width: 16px; height: 16px; margin-right: 6px;"></i>
            <span>Mark All Read</span>
          </button>
        </div>
      </header>

      <div class="app-body-layout" style="grid-template-columns: 1fr;">
        <div style="display: flex; flex-direction: column; gap: 12px;" id="notifications-list-container"></div>
      </div>

    </main>

    <nav class="mobile-bottom-nav" id="mobile-bottom-nav-container"></nav>

  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const user = await CS_AUTH.requireAuth();
      if (!user) return;

      CS_NAV.renderAppSidebar('notifications');
      await CS_NAV.populateUserInfo(user);
      CS_NAV.updateSidebarBadges(user, []);

      const container = document.getElementById('notifications-list-container');
      const isDemo = CS_AUTH.isDemoUser(user);

      if (isDemo) {
        container.innerHTML = `
          <div class="rail-widget" style="display: flex; gap: 16px; align-items: flex-start; border-left: 4px solid var(--accent-amber);">
            <div style="width: 40px; height: 40px; border-radius: var(--radius-sm); background: var(--accent-amber-container); color: var(--accent-amber); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
              <i data-lucide="alarm-clock" style="width: 20px; height: 20px;"></i>
            </div>
            <div style="flex: 1;">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
                <h4 style="font-size: 0.9375rem; font-weight: 700; color: var(--text-primary);">SXUK GenAI Hackathon 2026 Registration Closes in 3 Days</h4>
                <span style="font-size: 0.75rem; color: var(--text-muted);">2 hours ago</span>
              </div>
              <p style="font-size: 0.8125rem; color: var(--text-secondary); line-height: 1.5;">
                ACM Student Chapter reminds eligible B.Tech and Data Science teams to submit member GitHub handles before Sept 8, 11:59 PM.
              </p>
            </div>
          </div>

          <div class="rail-widget" style="display: flex; gap: 16px; align-items: flex-start; border-left: 4px solid var(--primary);">
            <div style="width: 40px; height: 40px; border-radius: var(--radius-sm); background: var(--primary-container); color: var(--primary-hover); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
              <i data-lucide="briefcase" style="width: 20px; height: 20px;"></i>
            </div>
            <div style="flex: 1;">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
                <h4 style="font-size: 0.9375rem; font-weight: 700; color: var(--text-primary);">New Placement Drive: EY Global Delivery Services 2027</h4>
                <span style="font-size: 0.75rem; color: var(--text-muted);">Yesterday</span>
              </div>
              <p style="font-size: 0.8125rem; color: var(--text-secondary); line-height: 1.5;">
                Central Placement Cell has approved pre-placement registration for B.Tech (CSE/AI/IT/ECE), B.Com, and BMS students with >= 7.5 CGPA.
              </p>
            </div>
          </div>

          <div class="rail-widget" style="display: flex; gap: 16px; align-items: flex-start; border-left: 4px solid var(--emerald);">
            <div style="width: 40px; height: 40px; border-radius: var(--radius-sm); background: var(--emerald-container); color: var(--emerald); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
              <i data-lucide="radio" style="width: 20px; height: 20px;"></i>
            </div>
            <div style="flex: 1;">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
                <h4 style="font-size: 0.9375rem; font-weight: 700; color: var(--text-primary);">CampusSignal System Update v1.4.2 (Build 17)</h4>
                <span style="font-size: 0.75rem; color: var(--text-muted);">Oct 13, 2026</span>
              </div>
              <p style="font-size: 0.8125rem; color: var(--text-secondary); line-height: 1.5;">
                Student Photo ID Verification: Gemini Vision Multimodal OCR with DPDP Act 2023 compliance, anti-identity sharing uniqueness, and Dean Moderation Hub.
              </p>
            </div>
          </div>
        `;
      } else {
        container.innerHTML = `
          <div style="text-align: center; padding: 48px 16px; background: var(--bg-surface); border: 1px dashed var(--border-subtle); border-radius: var(--radius-md);">
            <div style="width: 48px; height: 48px; border-radius: 50%; background: var(--bg-tertiary); display: inline-flex; align-items: center; justify-content: center; color: var(--text-muted); margin-bottom: 12px;">
              <i data-lucide="bell-off" style="width: 24px; height: 24px;"></i>
            </div>
            <h4 style="font-weight: 700; color: var(--text-primary); margin-bottom: 4px;">No Broadcasts Yet</h4>
            <p style="color: var(--text-secondary); font-size: 0.875rem;">You are all caught up with university announcements and signal alerts.</p>
          </div>
        `;
      }

      if (window.lucide) lucide.createIcons();

      document.getElementById('btn-mark-all-read').addEventListener('click', () => {
        alert('All signals marked as read.');
      });
    });
  </script>
</body>
</html>
