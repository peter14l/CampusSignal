<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — CampusSignal SXUK</title>
  <meta name="description" content="Sign in to CampusSignal for St. Xavier's University, Kolkata with Google OAuth, SXUK Email OTP, or Guest Mode.">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="../assets/img/app_logo.png">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/app.css">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Supabase JS Client v2 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- App Auth & Catalog Scripts -->
  <script src="../assets/js/catalog.js"></script>
  <script src="../assets/js/auth.js"></script>
</head>
<body style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at top right, rgba(79, 85, 222, 0.15), transparent 50%), var(--bg-primary); padding: 20px;">

  <div style="width: 100%; max-width: 440px; background: var(--bg-secondary); border: 1px solid var(--border-medium); border-radius: var(--radius-xl); padding: 36px 28px; box-shadow: var(--shadow-lg); position: relative;">
    
    <!-- Top Brand Header -->
    <div style="text-align: center; margin-bottom: 28px;">
      <a href="../index.html" style="display: inline-flex; align-items: center; gap: 10px; text-decoration: none; margin-bottom: 12px;">
        <img src="../assets/img/app_logo.png" alt="CampusSignal" style="width: 44px; height: 44px; border-radius: 12px; box-shadow: 0 4px 14px var(--primary-glow);">
        <span style="font-size: 1.4rem; font-weight: 800; color: var(--text-primary); letter-spacing: -0.02em;">CampusSignal</span>
      </a>
      <div style="font-size: 0.75rem; font-weight: 700; color: var(--primary); text-transform: uppercase; letter-spacing: 0.08em;">
        St. Xavier's University, Kolkata
      </div>
      <h1 style="font-size: 1.25rem; font-weight: 700; margin-top: 14px; color: var(--text-primary);">
        Sign in to your Academic Hub
      </h1>
      <p style="font-size: 0.875rem; color: var(--text-secondary); margin-top: 4px;">
        Real-time hackathons, drives & AI OCR broadcast signals.
      </p>
    </div>

    <!-- Alert Message Box -->
    <div id="auth-alert" style="display: none; padding: 12px 16px; border-radius: var(--radius-md); font-size: 0.8125rem; margin-bottom: 20px; line-height: 1.5;"></div>

    <!-- Auth Options -->
    <div style="display: flex; flex-direction: column; gap: 14px;">
      
      <!-- Google OAuth Button -->
      <button id="btn-google-auth" class="btn btn-outline" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; height: 48px; border-radius: var(--radius-md); background: var(--bg-tertiary); font-weight: 600;">
        <svg width="20" height="20" viewBox="0 0 24 24">
          <path fill="#EA4335" d="M12 5c1.56 0 2.97.55 4.07 1.45l3.05-3.05C17.27 1.7 14.81 1 12 1 7.42 1 3.53 3.6 1.63 7.37l3.69 2.86C6.2 7.34 8.87 5 12 5z"/>
          <path fill="#4285F4" d="M23.49 12.27c0-.79-.07-1.54-.19-2.27H12v4.51h6.47c-.29 1.48-1.14 2.73-2.4 3.58l3.7 2.87c2.16-2 3.72-4.94 3.72-8.69z"/>
          <path fill="#FBBC05" d="M5.32 14.77c-.23-.69-.36-1.42-.36-2.18s.13-1.49.36-2.18L1.63 7.55C.59 9.64 0 11.96 0 14.41s.59 4.77 1.63 6.86l3.69-2.86z"/>
          <path fill="#34A853" d="M12 23c3.24 0 5.95-1.08 7.93-2.91l-3.7-2.87c-1.08.72-2.45 1.16-4.23 1.16-3.13 0-5.8-2.34-6.68-5.23L1.63 17.01C3.53 20.78 7.42 23 12 23z"/>
        </svg>
        <span>Continue with Google</span>
      </button>

      <!-- Divider -->
      <div style="display: flex; align-items: center; gap: 12px; margin: 6px 0;">
        <div style="flex: 1; height: 1px; background: var(--border-subtle);"></div>
        <span style="font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em;">Or with Email OTP</span>
        <div style="flex: 1; height: 1px; background: var(--border-subtle);"></div>
      </div>

      <!-- Email OTP Form Step 1 -->
      <form id="email-otp-form" style="display: flex; flex-direction: column; gap: 12px;">
        <div>
          <label for="college-email" style="display: block; font-size: 0.8125rem; font-weight: 600; margin-bottom: 6px; color: var(--text-secondary);">
            Email Address (SXUK or Personal)
          </label>
          <div style="position: relative;">
            <input type="email" id="college-email" required placeholder="name@sxuk.edu.in" 
              style="width: 100%; height: 44px; padding: 0 14px 0 40px; border-radius: var(--radius-md); background: var(--bg-tertiary); border: 1px solid var(--border-subtle); color: var(--text-primary); font-family: var(--font-sans); font-size: 0.875rem;">
            <i data-lucide="mail" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--text-muted);"></i>
          </div>
        </div>

        <button type="submit" id="btn-send-otp" class="btn btn-primary" style="height: 44px; border-radius: var(--radius-md); font-weight: 600; width: 100%;">
          <span class="btn-text">Send Sign-in Code / Magic Link</span>
          <i data-lucide="arrow-right" style="width: 16px; height: 16px; margin-left: 6px;"></i>
        </button>
      </form>

      <!-- OTP Verification Form Step 2 (Initially Hidden) -->
      <form id="verify-otp-form" style="display: none; flex-direction: column; gap: 12px;">
        <div>
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
            <label for="otp-token" style="font-size: 0.8125rem; font-weight: 600; color: var(--text-secondary);">
              Enter 6-digit Security Code
            </label>
            <button type="button" id="btn-change-email" style="background: none; border: none; font-size: 0.75rem; color: var(--primary); cursor: pointer; text-decoration: underline;">
              Change Email
            </button>
          </div>
          <input type="text" id="otp-token" placeholder="123456" maxlength="8"
            style="width: 100%; height: 44px; padding: 0 14px; text-align: center; letter-spacing: 0.3em; font-family: var(--font-mono); font-size: 1.25rem; font-weight: 700; border-radius: var(--radius-md); background: var(--bg-tertiary); border: 1px solid var(--border-subtle); color: var(--text-primary);">
        </div>

        <button type="submit" id="btn-verify-otp" class="btn btn-primary" style="height: 44px; border-radius: var(--radius-md); font-weight: 600; width: 100%;">
          <span>Verify & Access Hub</span>
          <i data-lucide="check" style="width: 16px; height: 16px; margin-left: 6px;"></i>
        </button>
      </form>

      <!-- Guest / Instant Demo Mode -->
      <div style="margin-top: 10px; padding-top: 16px; border-top: 1px dashed var(--border-subtle); text-align: center;">
        <button id="btn-guest-mode" type="button" style="background: rgba(79, 85, 222, 0.08); border: 1px solid var(--border-highlight); color: var(--primary-hover); padding: 10px 18px; border-radius: var(--radius-md); font-size: 0.875rem; font-weight: 600; width: 100%; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all var(--transition-fast);">
          <i data-lucide="zap" style="width: 16px; height: 16px;"></i>
          <span>Instant Guest / Evaluation Mode</span>
        </button>
        <span style="display: block; font-size: 0.72rem; color: var(--text-muted); margin-top: 6px;">
          No password needed. Explore pre-seeded SXUK feeds & calendar sync instantly.
        </span>
      </div>

    </div>

    <!-- Back to landing -->
    <div style="text-align: center; margin-top: 24px;">
      <a href="../index.html" style="font-size: 0.8125rem; color: var(--text-muted); text-decoration: none; display: inline-flex; align-items: center; gap: 4px;">
        <i data-lucide="arrow-left" style="width: 14px; height: 14px;"></i>
        <span>Return to CampusSignal Home</span>
      </a>
    </div>

  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (window.lucide) lucide.createIcons();

      // Check if already authenticated
      const user = await CS_AUTH.getCurrentUser();
      if (user) {
        CS_AUTH.handlePostLoginRedirect();
        return;
      }

      const alertEl = document.getElementById('auth-alert');
      const googleBtn = document.getElementById('btn-google-auth');
      const emailForm = document.getElementById('email-otp-form');
      const verifyForm = document.getElementById('verify-otp-form');
      const emailInput = document.getElementById('college-email');
      const otpInput = document.getElementById('otp-token');
      const changeEmailBtn = document.getElementById('btn-change-email');
      const guestBtn = document.getElementById('btn-guest-mode');

      function showAlert(msg, isError = true) {
        alertEl.textContent = msg;
        alertEl.style.display = 'block';
        alertEl.style.background = isError ? 'var(--rose-container)' : 'var(--emerald-container)';
        alertEl.style.color = isError ? 'var(--rose)' : 'var(--emerald)';
        alertEl.style.border = `1px solid ${isError ? 'var(--rose)' : 'var(--emerald)'}`;
      }

      // 1. Google OAuth
      googleBtn.addEventListener('click', async () => {
        try {
          googleBtn.disabled = true;
          googleBtn.innerHTML = '<span>Connecting to Google...</span>';
          await CS_AUTH.signInWithGoogle();
        } catch (err) {
          showAlert(err.message || 'Google sign in could not be initiated.');
          googleBtn.disabled = false;
          googleBtn.innerHTML = `<span>Continue with Google</span>`;
        }
      });

      // 2. Send OTP
      emailForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = emailInput.value.trim();
        if (!email) return;

        const btn = document.getElementById('btn-send-otp');
        btn.disabled = true;
        btn.innerHTML = '<span>Sending security code...</span>';

        try {
          await CS_AUTH.sendOtpMagicLink(email);
          showAlert(`Security code sent to ${email}. Check your inbox.`, false);
          emailForm.style.display = 'none';
          verifyForm.style.display = 'flex';
          otpInput.focus();
        } catch (err) {
          showAlert(err.message || 'Failed to send OTP. Please check email address.');
        } finally {
          btn.disabled = false;
          btn.innerHTML = `<span>Send Sign-in Code / Magic Link</span>`;
          if (window.lucide) lucide.createIcons();
        }
      });

      // 3. Verify OTP
      verifyForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = emailInput.value.trim();
        const token = otpInput.value.trim();
        if (!token) return;

        const btn = document.getElementById('btn-verify-otp');
        btn.disabled = true;
        btn.innerHTML = '<span>Verifying code...</span>';

        try {
          await CS_AUTH.verifyOtpCode(email, token);
          showAlert('Authentication successful! Routing to your workspace...', false);
          setTimeout(() => {
            CS_AUTH.handlePostLoginRedirect();
          }, 800);
        } catch (err) {
          showAlert(err.message || 'Invalid or expired OTP code. Please retry.');
          btn.disabled = false;
          btn.innerHTML = `<span>Verify & Access Hub</span>`;
          if (window.lucide) lucide.createIcons();
        }
      });

      // Change email button
      changeEmailBtn.addEventListener('click', () => {
        verifyForm.style.display = 'none';
        emailForm.style.display = 'flex';
        alertEl.style.display = 'none';
      });

      // 4. Guest Mode
      guestBtn.addEventListener('click', () => {
        CS_AUTH.enterGuestMode();
      });
    });
  </script>
</body>
</html>
