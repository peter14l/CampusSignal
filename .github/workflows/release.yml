name: Release Android APKs (Split ABI & Universal)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'
      release_title:
        description: 'Release Title'
        required: false
        default: 'CampusSignal Production Release'
      is_prerelease:
        description: 'Mark as Pre-release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build_and_release:
    name: Build & Release Android APKs
    runs-on: ubuntu-latest

    steps:
      - name: 🛎️ Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 💙 Set up Latest Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: ℹ️ Print Flutter & Environment Info
        run: |
          flutter --version
          java -version

      - name: 🔐 Prepare Environment & Secrets (.env)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cat <<EOF > .env
          SUPABASE_URL=${SUPABASE_URL:-https://ksyvklijnkxfpiasncyr.supabase.co}
          SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-sb_publishable_VR_FIPoe9sLE4qGVLwF1tg_XW3Xuv9S}
          GEMINI_API_KEY=${GEMINI_API_KEY:-AIzaSyD-SVYpVeKTolCNjpnWW7xrjU6k3JgKWu8}
          EOF
          echo "Generated .env file from repository secrets for --dart-define-from-file."

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🔑 Restore Android Keystore & Credentials
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          mkdir -p android/app
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/campussignal-release.jks
            echo "Restored keystore from GitHub Secret."
          fi

          cat <<EOF > android/key.properties
          storePassword=${KEYSTORE_PASSWORD:-campussignal123}
          keyPassword=${KEY_PASSWORD:-campussignal123}
          keyAlias=${KEY_ALIAS:-campussignal}
          storeFile=campussignal-release.jks
          EOF
          echo "Generated android/key.properties."

      - name: 🏷️ Extract Version Information
        id: get_version
        run: |
          PUB_VERSION=$(grep 'version:' pubspec.yaml | sed 's/version: //' | tr -d ' \r\n')
          TAG_NAME="${{ github.event.inputs.tag_name }}"
          if [ -z "$TAG_NAME" ]; then
            TAG_NAME="${{ github.ref_name }}"
          fi
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "main" ]; then
            TAG_NAME="v${PUB_VERSION}"
          fi
          echo "version=${PUB_VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "Resolved Version: ${PUB_VERSION}, Tag: ${TAG_NAME}"

      - name: 🔨 Build Split-per-ABI Release APKs
        run: flutter build apk --release --split-per-abi --dart-define-from-file=.env

      - name: 🔨 Build Universal Release APK
        run: flutter build apk --release --dart-define-from-file=.env

      - name: 📂 Format & Organize Release Artifacts
        run: |
          mkdir -p release_artifacts
          VERSION="${{ steps.get_version.outputs.version }}"

          # Split ABI APKs
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "release_artifacts/CampusSignal-v${VERSION}-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "release_artifacts/CampusSignal-v${VERSION}-armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk "release_artifacts/CampusSignal-v${VERSION}-x86_64.apk"

          # Universal APK
          cp build/app/outputs/flutter-apk/app-release.apk "release_artifacts/CampusSignal-v${VERSION}-universal.apk"

          # Generate SHA256 Checksums for integrity
          cd release_artifacts
          sha256sum *.apk > checksums.sha256
          cd ..

          echo "Formatted Release Artifacts:"
          ls -lh release_artifacts

      - name: 🚀 Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: ${{ github.event.inputs.release_title || steps.get_version.outputs.tag }}
          draft: false
          prerelease: ${{ github.event.inputs.is_prerelease || false }}
          generate_release_notes: true
          files: |
            release_artifacts/*.apk
            release_artifacts/checksums.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
